
name: Construye Shotgun King para GBA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Compilar ROM
        run: make

      - name: Guardar ROM
        uses: actions/upload-artifact@v4
        with:
          name: ShotgunKing-GBA
          path: ShotgunKing.gba
